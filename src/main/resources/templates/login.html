<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
</head>

	<h1>ログイン</h1>

		<tr>

	<a href="/users/new">新規登録</a>

</html>
