<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>過去の記録</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>
	<header>
		<span class="glitch" data-text="Let's 腹筋！">Let's 腹筋！</span>
	</header>

	<main>
		<hr>
		<h3><span th:text="${@account.name} + ' さん、こんにちは'"></span></h3>
		<table border="1" class="pasttable">
			<tr>
				<th>日付</th>
				<th>種目</th>
				<th>時間</th>
				<th>体重</th>
				<th>消費カロリー</th>
				<th>memo</th>
				<th>更新</th>
				<th>削除</th>
			</tr>
			<tr th:each="record : ${records}">
				<td th:text="${record.date}"></td>
				<td>
					<span th:each="event : ${events}">
						<span th:if="${event.id == record.eventId}" th:text="${event.name}"></span>
					</span>
				</td>
				<td th:text="${record.time + ' 分'}"></td>
				<td th:text="${record.weight + ' kg'}"></td>
				<td th:text="${'約 ' + record.burnCalorie + 'kcal '}"></td>
				<td th:text="${record.memo}"></td>
				<td>
					<form th:action="@{/past/{pastId}/edit(pastId=${record.id})}" method="get">
						<button class="btn3">更新</button>
					</form>
				</td>
				<td>
					<form th:action="@{/past/{id}/delete(id=${record.id})}" method="post">
						<button class="btn3">削除</button>
					</form>
				</td>
			</tr>
		</table><br>
		<table border="1" class="totaltable">
			<tr>
				<th>合計消費カロリー</th>
			</tr>
			<tr>
				<td><span th:text="${#aggregates.sum(records.![burnCalorie]) + 'kcal'}"></span></td>
			</tr>
		</table>
		
		<a href="/records/add" class="backrecords">入力画面へ戻る</a>

	</main>
	
	
	<footer>
		<hr>
		<p><small>&copy; by watanabe momoko</small></p>
	</footer>
</body>



</html>
