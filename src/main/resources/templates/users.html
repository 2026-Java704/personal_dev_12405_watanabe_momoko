<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>新規登録</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<header>
		<h1>Let's 腹筋！</h1>
	</header>

	<main>
		<hr>
		<h3>新規登録</h3>
		<form action="/users/add" method="post">
			<div th:if="${errorList}">
				<div th:each="error : ${errorList}" th:text="${error}" style="color: red"></div>
			</div>
		
				<table border="1">
					<tr>
						<th class="newth">お名前</th>
						<td class="newtd"><input type="text" name="name" th:value="${name}"></td>
					</tr>
					<tr>
						<th class="newth">パスワード</th>
						<td class="newtd"><input type="password" name="password"></td>
					</tr>
				</table>
			
			<button class="btn1">登録</button>
		</form>
		<p><a href="/login" class="backlogin">ログイン画面へ戻る</a></p>
	</main>
	<hr>
</body>

</html>
